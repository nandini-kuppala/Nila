name: Release

# Publishes the three APKs to a GitHub release. Nothing did this before: the
# assets on v1.0.2 were built on somebody's Mac and uploaded by hand, which is
# why the "Download the APK" link in the README spent three merged pull
# requests pointing at a build that contained none of them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, e.g. v1.0.3'
        required: true

permissions:
  contents: write        # needed to create the release

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---------------------------------------------------------------
      # The signing key, and why it is handled this way
      #
      # `assembleRelease` is signed with the *debug* key on purpose -- it makes
      # a demo build installable without a keystore ceremony. That is fine on
      # one machine and broken in CI, because a runner generates a fresh debug
      # keystore on every job. Android refuses an update signed with a
      # different key, so every release would force an uninstall, and an
      # uninstall takes the care log, the health documents and any optional
      # model with it.
      #
      # So the key is carried in a secret. Put the *existing* one there and
      # these builds stay installable over v1.0.2:
      #
      #   base64 -i ~/.android/debug.keystore | pbcopy
      #
      # then paste it into Settings -> Secrets and variables -> Actions as
      # ANDROID_DEBUG_KEYSTORE_BASE64.
      #
      # Nothing in the repository needs to change: the file is written to the
      # default debug-keystore path, which is where the Gradle config already
      # looks. Without the secret the job still builds, and says loudly that
      # the result cannot be installed as an update.
      # ---------------------------------------------------------------
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning title=No signing key::ANDROID_DEBUG_KEYSTORE_BASE64 is not set. \
          This build will be signed with a throwaway key generated on this runner, so it \
          CANNOT be installed as an update over an existing Nila -- users would have to \
          uninstall first and would lose their data."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          echo "Signing key restored."

      - name: Build
        working-directory: android
        run: ./gradlew :app:assembleRelease :wear:assembleRelease

      # Named for a human choosing between them on a phone, not for Gradle.
      - name: Name the APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk \
             dist/Nila-phone-arm64.apk
          cp android/app/build/outputs/apk/release/app-x86_64-release.apk \
             dist/Nila-emulator-x86_64.apk
          cp android/wear/build/outputs/apk/release/wear-release.apk \
             dist/Nila-watch.apk
          ls -lh dist/

      # Printed into the job log so the key a release was signed with is a
      # matter of record rather than something to work out later from an APK.
      - name: Report what was signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          "$APKSIGNER" verify --print-certs dist/Nila-phone-arm64.apk \
            | grep -i "SHA-256 digest" || true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.apk \
            --repo "${{ github.repository }}" \
            --title "Nila $TAG" \
            --generate-notes \
            --verify-tag
