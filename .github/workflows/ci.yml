name: CI

# Nila had no CI at all. Three pull requests were merged on the strength of
# "it built on my Mac", which is exactly the claim a baby monitor should not
# be resting on -- and the one test suite that matters here (187 of them) takes
# under a minute to run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A second push to the same branch makes the first run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      # Compiled, not run. The instrumented suite needs a device, and an
      # emulator on a runner triples the job time -- but a compile failure here
      # is a real break and it costs seconds to catch.
      - name: Compile the instrumented suite
        working-directory: android
        run: ./gradlew :app:compileDebugAndroidTestKotlin

      # R8 and resource shrinking only run in release, and this project has
      # already shipped two bugs that existed nowhere else.
      - name: Release build
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      # Not a release, just something installable from any commit. Artifacts
      # expire and are only reachable by someone logged in to GitHub, which is
      # the right level of access for a build off an arbitrary branch.
      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: nila-apks-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
